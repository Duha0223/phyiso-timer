<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physio Workout Suite</title>
<style>
  :root {
    --glass-card: rgba(18, 32, 25, 0.72);
    --glass-border: rgba(180, 225, 195, 0.28);
    --glass-border-light: rgba(255, 255, 255, 0.18);
    --text: #f3f9f4;
    --muted: #a6c9b2;
    --col-ready:  #e08a3c;
    --col-active: #d65d45;
    --col-rest:   #4ba368;
    --col-done:   #2e5c3e;
    --col-plain:  #d1973c;
    --col-next:   #345843;
  }
  *, *::before, *::after { box-sizing: border-box; }
  
  body {
    margin: 0; padding: 14px 18px;
    background: url('https://wallpapers-clan.com/wp-content/uploads/2024/07/studio-ghibli-totoro-forest-desktop-wallpaper-preview.jpg') no-repeat center center fixed;
    background-size: cover;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1600px;
    height: 96vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }
  h1 { font-size: 1.35rem; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .sub { color: var(--muted); font-size: .8rem; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }

  /* ── Split Layout: 60% Left Media, 40% Right Timer/Playlist ── */
  .layout-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .media-panel {
    background: var(--glass-card);
    border: 1.5px solid var(--glass-border);
    border-radius: 22px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
    min-height: 0;
  }

  .tab-bar {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 8px;
  }
  .tab-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border-light);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-size: .82rem;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--col-rest);
    color: #fff;
    border-color: #8edaa5;
  }

  .tab-content {
    display: none;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }
  .tab-content.active { display: flex; }

  .search-row { display: flex; gap: 8px; }
  .media-inp {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border);
    border-radius: 9px;
    padding: 8px 12px;
    font-size: .84rem;
    color: #fff;
  }
  .media-inp:focus { outline: 2px solid var(--col-rest); }
  .btn-action {
    background: var(--col-rest);
    border-radius: 9px;
    padding: 8px 16px;
    font-size: .84rem;
    border: none;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .video-viewport {
    flex: 1;
    min-height: 0;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.65);
    border: 1.5px solid var(--glass-border);
  }
  .video-viewport iframe, .video-viewport video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover;
  }

  .sound-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .sound-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .sound-card:hover { background: rgba(255, 255, 255, 0.15); }
  .sound-card.active { background: var(--col-rest); border-color: #8edaa5; }
  .sound-card span { display: block; font-size: 1.4rem; margin-bottom: 4px; }
  .sound-card small { font-size: .78rem; font-weight: 600; }

  /* ── Right Column: Timer & Playlist ── */
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    min-height: 0;
  }

  .stage {
    background: var(--glass-card);
    border: 1.5px solid var(--glass-border);
    border-radius: 20px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .circle-wrap { position: relative; width: 105px; height: 105px; flex-shrink: 0; }
  .circle-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  circle.bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 12; }
  circle.fg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke .3s; }
  .circle-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .bignum { font-size: 1.85rem; font-weight: 900; line-height: 1; }

  .stage-info { flex: 1; min-width: 0; }
  .ex-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-phase {
    font-size: .72rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px;
  }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  button.ctrl {
    border: 1px solid var(--glass-border-light); border-radius: 9px; padding: 7px 11px;
    font-size: .78rem; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.12); color: var(--text);
  }
  button.ctrl:hover { background: rgba(255,255,255,0.22); }
  button.ctrl.primary { background: var(--col-active); border-color: rgba(255,255,255,0.3); }
  button.ctrl.danger  { background: rgba(144, 48, 16, 0.7); }
  button.ctrl.pause-all { background: #b8600a; border-color: #f7a261; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  /* Playlist */
  .playlist-panel {
    flex: 1;
    min-height: 0;
    background: var(--glass-card);
    border: 1.5px solid var(--glass-border);
    border-radius: 20px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }
  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--glass-border);
  }
  .playlist-header span {
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
  }
  .playlist-container {
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
    margin-bottom: 8px;
  }
  .playlist-container::-webkit-scrollbar { width: 5px; }
  .playlist-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  #playlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li.ex-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    overflow: hidden;
    backdrop-filter: blur(8px);
    transition: background .2s, border-color .2s;
  }
  li.ex-item:hover { background: rgba(255,255,255,0.1); }
  li.ex-item.active-ex { border-color: #f7a261; box-shadow: 0 0 12px rgba(224, 138, 60, 0.35); background: rgba(46, 75, 58, 0.7); }
  
  .ex-header {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none;
  }
  .handle { cursor: grab; color: var(--muted); font-size: 1rem; }
  .ex-check { accent-color: var(--col-rest); width: 14px; height: 14px; cursor: pointer; }
  .ex-label { flex: 1; min-width: 0; }
  .ex-label-name { font-weight: 700; font-size: .86rem; }
  .ex-label-meta { font-size: .7rem; color: var(--muted); }
  .chevron { color: var(--muted); font-size: .8rem; transition: transform .2s; }
  .chevron.open { transform: rotate(90deg); }
  
  .ex-body { display: none; padding: 8px 10px 10px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.15); }
  .ex-body.open { display: block; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px,1fr)); gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: .65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .f-inp {
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 6px;
    padding: 5px 6px; font-size: .8rem; color: #fff; width: 100%;
  }
  .f-inp option { background: #1b2e23; color: #fff; }
  .time-row { display: flex; gap: 4px; align-items: center; }
  .time-row .f-inp { width: 50px; }
  .ex-actions { margin-top: 8px; display: flex; }
  .btn-delete { background: rgba(180, 40, 40, 0.4); color: #fff; border-radius: 6px; padding: 4px 8px; font-size: .72rem; margin-left: auto; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }

  .btn-add {
    width: 100%; background: rgba(75, 163, 104, 0.35); border: 1px solid rgba(142, 218, 165, 0.4);
    border-radius: 10px; padding: 8px; font-size: .84rem; color: #fff; font-weight: 700; cursor: pointer;
  }

  footer { color: var(--muted); font-size: .7rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🩹 Physio Workout Suite</h1>
      <div class="sub">Widescreen Edition · Independent Media & Timer Controls</div>
    </div>
  </header>

  <div class="layout-grid">
    <!-- Left Column: Media Suite -->
    <div class="left-col">
      <div class="media-panel">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="tab-yt">📺 YouTube Video / Search</button>
          <button class="tab-btn" data-tab="tab-audio">🌿 Nature Sounds</button>
          <button class="tab-btn" data-tab="tab-local">📁 Local Media</button>
        </div>

        <!-- Tab 1: YouTube Search & Player -->
        <div class="tab-content active" id="tab-yt">
          <div class="search-row">
            <input type="text" class="media-inp" id="ytInp" placeholder="Enter link or search term (e.g. momomi, lofi, stretching)">
            <button class="btn-action" id="btnLoadYt">Load / Search</button>
          </div>
          <div class="video-viewport">
            <iframe id="ytFrame" src="https://www.youtube-nocookie.com/embed?listType=search&list=lofi+workout+ambient&enablejsapi=1" allow="autoplay; fullscreen; encrypted-media"></iframe>
          </div>
        </div>

        <!-- Tab 2: Nature Sounds -->
        <div class="tab-content" id="tab-audio">
          <div class="sound-grid">
            <div class="sound-card active" data-src="">
              <span>🔇</span><small>Mute</small>
            </div>
            <div class="sound-card" data-src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=rain-and-thunder-nature-sounds-7803.mp3">
              <span>🌧️</span><small>Rain & Thunder</small>
            </div>
            <div class="sound-card" data-src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_849646b986.mp3?filename=forest-birds-chirping-nature-sounds-7798.mp3">
              <span>🌲</span><small>Forest Birds</small>
            </div>
            <div class="sound-card" data-src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c770c89a.mp3?filename=ocean-waves-ambient-relaxing-sound-10940.mp3">
              <span>🌊</span><small>Ocean Waves</small>
            </div>
            <div class="sound-card" data-src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=crackling-fireplace-nature-sounds-8012.mp3">
              <span>🔥</span><small>Campfire</small>
            </div>
            <div class="sound-card" data-src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-rain-ambient-111154.mp3">
              <span>💧</span><small>Gentle Rain</small>
            </div>
          </div>
          <audio id="ambientAudio" loop crossorigin="anonymous"></audio>
        </div>

        <!-- Tab 3: Local File -->
        <div class="tab-content" id="tab-local">
          <div class="search-row">
            <input type="file" class="media-inp" id="localFileInput" accept="video/*,audio/*">
          </div>
          <div class="video-viewport">
            <video id="localVideo" controls loop playsinline></video>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Timer & Routine -->
    <div class="right-col">
      <div class="stage">
        <div class="circle-wrap">
          <svg viewBox="0 0 200 200">
            <circle class="bg" cx="100" cy="100" r="86"/>
            <circle class="fg" id="fgCircle" cx="100" cy="100" r="86"
              stroke-dasharray="540" stroke-dashoffset="540" stroke="var(--col-ready)"/>
          </svg>
          <div class="circle-center">
            <div class="bignum" id="bignum">--</div>
          </div>
        </div>
        <div class="stage-info">
          <div class="ex-title" id="exTitle">Ready</div>
          <div class="ex-phase" id="exPhase">Tap Start Workout</div>
          <div class="btn-row">
            <button class="ctrl primary" id="btnStart">▶ Start</button>
            <button class="ctrl" id="btnPause" disabled>⏸ Pause</button>
            <button class="ctrl pause-all" id="btnPauseAll">⏸ Pause All</button>
            <button class="ctrl" id="btnSkip" disabled>⏭ Skip</button>
            <button class="ctrl danger" id="btnReset">↺</button>
          </div>
        </div>
      </div>

      <div class="playlist-panel">
        <div class="playlist-header">
          <span>Workout Routine</span>
        </div>
        <div class="playlist-container">
          <ul id="playlist"></ul>
        </div>
        <button class="btn-add" id="btnAddEx">＋ Add Exercise</button>
      </div>
    </div>
  </div>

  <footer>Independent Audio/Video streams · Master Pause Available</footer>
</div>

<script>
/* ═══════════════════ DATA & STORAGE ═══════════════════ */
const STORAGE_KEY = 'physio_suite_v3';
const CIRC = 2 * Math.PI * 86;

const DEFAULT_EXERCISES = [
  { id:'heat',        name:'Heat Pad',                      enabled:true, type:'plain',   sets:1, reps:1,  repUnit:'min', repMins:15, repSecs:0,  restSecs:3, restEnabled:false },
  { id:'slrL',        name:'SLR – Left Leg',                enabled:true, type:'counted', sets:1, reps:10, repUnit:'sec', repMins:0,  repSecs:5,  restSecs:3, restEnabled:true  },
  { id:'slrR',        name:'SLR – Right Leg',               enabled:true, type:'counted', sets:1, reps:10, repUnit:'sec', repMins:0,  repSecs:5,  restSecs:3, restEnabled:true  },
  { id:'glute',       name:'Glute Bridge',                  enabled:true, type:'counted', sets:1, reps:8,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'fig4L',       name:'Figure 4 Stretch – Left',       enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'fig4R',       name:'Figure 4 Stretch – Right',      enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'wideGlute',   name:'Wide Stance Glute Bridge',      enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'narrowGlute', name:'Narrow Stance Glute Bridge',    enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'plank',       name:'Plank',                         enabled:true, type:'plain',   sets:1, reps:1,  repUnit:'sec', repMins:0,  repSecs:30, restSecs:3, restEnabled:false },
];

function loadEx() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
}
function saveEx() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(exercises)); } catch(e){} }

let exercises = loadEx();
function repDur(ex) { return ex.repUnit==='min' ? ex.repMins*60+(ex.repSecs||0) : (ex.repSecs||0); }
function metaText(ex) {
  const d = repDur(ex);
  const ds = ex.repUnit==='min' ? `${ex.repMins}m${(ex.repSecs||0)?(' '+(ex.repSecs||0)+'s'):''}` : `${d}s`;
  if (ex.type==='plain') return `Timer · ${ds}`;
  const r = ex.restEnabled ? ` · rest ${ex.restSecs}s` : '';
  return `${ex.sets} set${ex.sets>1?'s':''} · ${ex.reps} reps · ${ds}/rep${r}`;
}

/* ═══════════════════ STATE ═══════════════════ */
let running=false, paused=false, stopReq=false, skipReq=false, runToken=0;
let wakeLock = null;

const $=id=>document.getElementById(id);
const el={
  title:$('exTitle'), phase:$('exPhase'), bignum:$('bignum'),
  fg:$('fgCircle'), btnStart:$('btnStart'), btnPause:$('btnPause'),
  btnSkip:$('btnSkip'), btnReset:$('btnReset'), playlist:$('playlist'),
  ytFrame:$('ytFrame'), ytInp:$('ytInp'), btnLoadYt:$('btnLoadYt'),
  ambientAudio:$('ambientAudio'), localVideo:$('localVideo'), localFileInput:$('localFileInput'),
  btnPauseAll:$('btnPauseAll')
};

/* ═══════════════════ TAB SWITCHING ═══════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $(btn.dataset.tab).classList.add('active');
  });
});

/* ═══════════════════ YOUTUBE & AUDIO ENGINE ═══════════════════ */
function loadMediaContent() {
  const input = el.ytInp.value.trim();
  if (!input) return;

  // Direct ID check
  const idMatch = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
  const videoId = idMatch ? idMatch[1] : (/^[a-zA-Z0-9_-]{11}$/.test(input) ? input : null);

  if (videoId) {
    el.ytFrame.src = `https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1&autoplay=1&rel=0&modestbranding=1`;
  } else {
    // If user types general keywords like "momomi", embed YouTube's official search feed
    el.ytFrame.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(input)}&enablejsapi=1&autoplay=1`;
  }
}

el.btnLoadYt.addEventListener('click', loadMediaContent);
el.ytInp.addEventListener('keydown', e => { if (e.key === 'Enter') loadMediaContent(); });

// Ambient sound switcher
document.querySelectorAll('.sound-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.sound-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    const src = card.dataset.src;
    if (src) {
      el.ambientAudio.src = src;
      el.ambientAudio.play().catch(e => console.warn("Audio waiting for user gesture", e));
    } else {
      el.ambientAudio.pause();
      el.ambientAudio.src = '';
    }
  });
});

// Local file preview
el.localFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    el.localVideo.src = URL.createObjectURL(file);
    el.localVideo.play().catch(()=>{});
  }
});

/* ═══════════════════ MASTER PAUSE ALL ═══════════════════ */
el.btnPauseAll.addEventListener('click', () => {
  // 1. Pause workout timer
  if (running && !paused) {
    paused = true;
    el.btnPause.textContent = '▶ Resume';
    speak('All paused.');
  }
  // 2. Pause ambient sound
  if (el.ambientAudio) el.ambientAudio.pause();
  // 3. Pause local media
  if (el.localVideo) el.localVideo.pause();
  // 4. Pause YouTube embed
  try {
    el.ytFrame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
  } catch(e){}
});

/* ═══════════════════ WAKE LOCK & GRAPHICS ═══════════════════ */
async function acquireWakeLock() {
  if ('wakeLock' in navigator && !wakeLock) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch(e){}
  }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
}

function setCircle(frac, color) {
  el.fg.setAttribute('stroke-dashoffset', (CIRC*(1-Math.max(0,Math.min(1,frac)))).toFixed(2));
  el.fg.setAttribute('stroke', color);
}
setCircle(0,'var(--col-ready)');

function fmtTime(s) {
  if (s>=60) return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  return String(s);
}

function speak(text, rate=1, pitch=1) {
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); } catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.rate=rate; u.pitch=pitch; u.volume=1;
  window.speechSynthesis.speak(u);
}

/* ═══════════════════ TIMERS & TICKERS ═══════════════════ */
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
async function waitPaused(token) {
  while (paused && token===runToken && !stopReq && !skipReq) await sleep(80);
}

async function tickCircle(token, totalSecs, color, onTick) {
  let rem = totalSecs;
  setCircle(rem/totalSecs, color);
  if (onTick) onTick(rem);

  while (rem > 0) {
    if (token!==runToken || stopReq || skipReq) return false;
    await waitPaused(token);
    if (token!==runToken || stopReq || skipReq) return false;
    await sleep(1000);
    if (token!==runToken || stopReq || skipReq) return false;
    rem--;
    setCircle(rem/totalSecs, color);
    if (onTick) onTick(rem);
  }
  return true;
}

async function doReady(token, name) {
  el.title.textContent = name;
  el.phase.textContent = 'GET READY';
  speak('Ready.');
  for (let i=3; i>=1; i--) {
    if (token!==runToken || stopReq || skipReq) return false;
    await waitPaused(token);
    el.bignum.textContent = String(i);
    setCircle(i/3, 'var(--col-ready)');
    await sleep(1000);
  }
  return token===runToken && !stopReq && !skipReq;
}

async function doTransition(token, name) {
  el.title.textContent = name;
  el.phase.textContent = 'NEXT UP';
  el.bignum.textContent = '…';
  setCircle(1, 'var(--col-next)');
  speak(`Next: ${name}.`);
  await sleep(1800);
  return token===runToken && !stopReq && !skipReq;
}

async function doRest(token, secs) {
  if (!secs || secs<=0) return true;
  el.phase.textContent = 'REST';
  speak('Rest.');
  return await tickCircle(token, secs, 'var(--col-rest)', s => {
    el.bignum.textContent = fmtTime(s);
  });
}

async function runPlain(ex, token) {
  if (!await doReady(token, ex.name)) return;
  await sleep(300);
  const dur = repDur(ex);
  speak('Start.');
  const ok = await tickCircle(token, dur, 'var(--col-plain)', s => {
    el.phase.textContent = 'IN PROGRESS';
    el.bignum.textContent = fmtTime(s);
    if (dur>=120 && s===60) speak('One minute left.');
    else if (dur>=60 && s===30) speak('Thirty seconds left.');
    else if (s<=3 && s>0) speak(String(s));
  });
  if (ok) {
    speak('Done.');
    el.phase.textContent='COMPLETE';
    el.bignum.textContent='✓';
    setCircle(0,'var(--col-done)');
    await sleep(900);
  }
}

async function runCounted(ex, token) {
  const repSecs = repDur(ex);
  const restSecs = ex.restEnabled ? (ex.restSecs||0) : 0;

  for (let set=1; set<=ex.sets; set++) {
    if (token!==runToken || stopReq || skipReq) return;
    const setLbl = ex.sets>1 ? ` (Set ${set}/${ex.sets})` : '';

    if (!await doReady(token, ex.name+setLbl)) return;
    await sleep(200);
    speak('Start.');
    await sleep(600);

    for (let rep=1; rep<=ex.reps; rep++) {
      if (token!==runToken || stopReq || skipReq) return;
      await waitPaused(token);

      speak(String(rep));

      const ok = await tickCircle(token, repSecs, 'var(--col-active)', s => {
        el.phase.textContent = `REP ${rep} of ${ex.reps}${setLbl}`;
        el.bignum.textContent = fmtTime(s);
      });
      if (!ok) return;

      const lastRep = rep===ex.reps, lastSet = set===ex.sets;
      if (restSecs>0 && !(lastRep && lastSet)) {
        if (!await doRest(token, restSecs)) return;
      }
    }

    speak('Set complete.');
    el.phase.textContent=`SET ${set} COMPLETE`;
    el.bignum.textContent='✓';
    setCircle(0,'var(--col-done)');
    await sleep(900);

    if (set < ex.sets) {
      speak('Rest before next set.');
      el.phase.textContent='REST — NEXT SET';
      const setRest = Math.max(restSecs*3, 15);
      if (!await tickCircle(token, setRest, 'var(--col-rest)', s => {
        el.bignum.textContent=fmtTime(s);
      })) return;
    }
  }

  el.phase.textContent='COMPLETE';
  el.bignum.textContent='✓';
  setCircle(0,'var(--col-done)');
  await sleep(900);
}

/* ═══════════════════ SEQUENCER ═══════════════════ */
async function startWorkout() {
  if (running) return;
  await acquireWakeLock();

  running=true; paused=false; stopReq=false; skipReq=false;
  runToken++;
  const token = runToken;
  el.btnStart.disabled=true; el.btnPause.disabled=false; el.btnSkip.disabled=false;
  renderPlaylist();

  const active = exercises.filter(e => e.enabled);
  if (!active.length) {
    el.title.textContent='No exercises enabled';
    el.phase.textContent='Enable at least one below';
    endSession();
    return;
  }

  for (let i=0; i<active.length; i++) {
    if (token!==runToken || stopReq) break;
    skipReq = false;
    const ex = active[i];
    highlightActive(ex.id);

    if (i > 0) {
      const ok = await doTransition(token, ex.name);
      if (!ok && !skipReq) break;
    }
    
    if (token!==runToken || stopReq) break;

    if (ex.type === 'plain') await runPlain(ex, token);
    else                     await runCounted(ex, token);
  }

  if (token === runToken) {
    el.title.textContent = stopReq ? 'Stopped' : '🎉 Complete!';
    el.phase.textContent = stopReq ? '' : 'Great work!';
    el.bignum.textContent = stopReq ? '' : '✓';
    setCircle(0,'var(--col-done)');
    if (!stopReq) speak('Workout complete. Great job!');
    endSession();
  }
}

function endSession() {
  running=false; paused=false;
  releaseWakeLock();
  el.btnStart.disabled=false; el.btnPause.disabled=true; el.btnSkip.disabled=true;
  el.btnPause.textContent='⏸ Pause';
  highlightActive(null);
  renderPlaylist();
}

function pauseResume() {
  if (!running) return;
  paused = !paused;
  el.btnPause.textContent = paused ? '▶ Resume' : '⏸ Pause';
  if (paused) {
    try { window.speechSynthesis.cancel(); } catch(e){}
    speak('Paused.');
  } else {
    speak('Resuming.');
  }
}

function skipEx() {
  if (!running) return;
  try { window.speechSynthesis.cancel(); } catch(e){}
  skipReq = true;
}

function resetAll() {
  try { window.speechSynthesis.cancel(); } catch(e){}
  stopReq = true;
  skipReq = true;
  paused = false;
  runToken++;
  endSession();
  el.title.textContent = 'Ready';
  el.phase.textContent = 'Tap Start';
  el.bignum.textContent = '--';
  setCircle(0,'var(--col-ready)');
}

/* ═══════════════════ PLAYLIST UI ═══════════════════ */
let dragSrcId=null, openIds=new Set();

function highlightActive(id) {
  document.querySelectorAll('li.ex-item').forEach(li => {
    li.classList.toggle('active-ex', li.dataset.id === id);
    if (li.dataset.id === id) {
      li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
}

function newId() { return 'ex_'+Date.now()+'_'+Math.floor(Math.random()*1000); }

function addExercise() {
  const ex = {
    id: newId(),
    name: 'New Exercise',
    enabled: true,
    type: 'counted',
    sets: 1,
    reps: 10,
    repUnit: 'sec',
    repMins: 0,
    repSecs: 10,
    restSecs: 3,
    restEnabled: true
  };
  exercises.push(ex);
  openIds.add(ex.id);
  saveEx();
  renderPlaylist();
}

function deleteEx(id) {
  if (!confirm('Delete this exercise?')) return;
  exercises = exercises.filter(e => e.id !== id);
  openIds.delete(id);
  saveEx();
  renderPlaylist();
}

function renderPlaylist() {
  el.playlist.innerHTML='';
  exercises.forEach(ex => {
    const li=document.createElement('li'); li.className='ex-item'; li.dataset.id=ex.id;
    li.draggable=!running;
    const isOpen=openIds.has(ex.id);

    const hdr=document.createElement('div'); hdr.className='ex-header';
    const handle=document.createElement('span'); handle.className='handle'; handle.textContent='☰';
    hdr.appendChild(handle);
    const chk=document.createElement('input'); chk.type='checkbox'; chk.className='ex-check';
    chk.checked=ex.enabled; chk.disabled=running;
    chk.addEventListener('change',e=>{e.stopPropagation();ex.enabled=chk.checked;saveEx();renderPlaylist();});
    hdr.appendChild(chk);
    const lbl=document.createElement('div'); lbl.className='ex-label';
    lbl.innerHTML=`<div class="ex-label-name">${ex.name}</div><div class="ex-label-meta">${metaText(ex)}</div>`;
    hdr.appendChild(lbl);
    const chev=document.createElement('span'); chev.className='chevron'+(isOpen?' open':''); chev.textContent='›';
    hdr.appendChild(chev);
    hdr.addEventListener('click',e=>{if(e.target===chk)return;isOpen?openIds.delete(ex.id):openIds.add(ex.id);renderPlaylist();});
    li.appendChild(hdr);

    const body=document.createElement('div'); body.className='ex-body'+(isOpen?' open':'');
    const grid=document.createElement('div'); grid.className='field-grid';

    grid.appendChild(mField('Name',()=>{
      const i=mInpTxt(ex.name,v=>{ex.name=v;saveEx();renderPlaylist();}); return i;
    }));
    grid.appendChild(mField('Type',()=>{
      const s=mSel([['counted','Counted Reps'],['plain','Simple Timer']],ex.type,v=>{
        ex.type=v; if(v==='plain'){ex.sets=1;ex.reps=1;ex.restEnabled=false;} saveEx();renderPlaylist();
      }); return s;
    }));

    const dF=document.createElement('div'); dF.className='field';
    const dL=document.createElement('label'); dL.textContent='Duration'; dF.appendChild(dL);
    const uSel=mSel([['sec','Sec'],['min','Min']],ex.repUnit,v=>{ex.repUnit=v;saveEx();renderPlaylist();});
    uSel.style.marginBottom='3px'; dF.appendChild(uSel);
    if(ex.repUnit==='min'){
      const row=document.createElement('div'); row.className='time-row';
      row.appendChild(mNumInp(ex.repMins,0,60,v=>{ex.repMins=v;saveEx();renderPlaylist();},'m'));
      row.appendChild(mNumInp(ex.repSecs||0,0,59,v=>{ex.repSecs=v;saveEx();renderPlaylist();},'s'));
      dF.appendChild(row);
    } else {
      dF.appendChild(mNumInp(ex.repSecs,1,3600,v=>{ex.repSecs=v;saveEx();renderPlaylist();},'s'));
    }
    grid.appendChild(dF);

    if(ex.type==='counted'){
      grid.appendChild(mField('Sets',()=>mNumInp(ex.sets,1,20,v=>{ex.sets=v;saveEx();renderPlaylist();})));
      grid.appendChild(mField('Reps',()=>mNumInp(ex.reps,1,50,v=>{ex.reps=v;saveEx();renderPlaylist();})));
      
      const rF=document.createElement('div'); rF.className='field';
      const rL=document.createElement('label'); rL.textContent='Rest (s)'; rF.appendChild(rL);
      const rRow=document.createElement('div'); rRow.className='time-row';
      const rChk=document.createElement('input'); rChk.type='checkbox'; rChk.checked=ex.restEnabled;
      rChk.disabled=running;
      rChk.addEventListener('change',()=>{ex.restEnabled=rChk.checked;saveEx();renderPlaylist();});
      rRow.appendChild(rChk);
      rRow.appendChild(mNumInp(ex.restSecs,1,60,v=>{ex.restSecs=v;saveEx();renderPlaylist();},'s'));
      rF.appendChild(rRow); grid.appendChild(rF);
    }

    body.appendChild(grid);
    const acts=document.createElement('div'); acts.className='ex-actions';
    const del=document.createElement('button'); del.className='btn-delete'; del.textContent='🗑 Delete';
    del.disabled=running; del.addEventListener('click',()=>deleteEx(ex.id)); acts.appendChild(del);
    body.appendChild(acts);
    li.appendChild(body);

    li.addEventListener('dragstart',e=>{if(running)return;dragSrcId=ex.id;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    li.addEventListener('dragend',()=>li.classList.remove('dragging'));
    li.addEventListener('dragover',e=>e.preventDefault());
    li.addEventListener('drop',e=>{
      e.preventDefault(); if(running||!dragSrcId||dragSrcId===ex.id)return;
      const fi=exercises.findIndex(x=>x.id===dragSrcId), ti=exercises.findIndex(x=>x.id===ex.id);
      const[m]=exercises.splice(fi,1); exercises.splice(ti,0,m);
      dragSrcId=null; saveEx(); renderPlaylist();
    });

    el.playlist.appendChild(li);
  });
}

function mField(label, buildInput) {
  const f=document.createElement('div'); f.className='field';
  const l=document.createElement('label'); l.textContent=label; f.appendChild(l);
  f.appendChild(buildInput()); return f;
}
function mInpTxt(val, onChange) {
  const i=document.createElement('input'); i.type='text'; i.className='f-inp'; i.value=val; i.disabled=running;
  i.addEventListener('change',()=>onChange(i.value)); return i;
}
function mSel(opts, val, onChange) {
  const s=document.createElement('select'); s.className='f-inp'; s.disabled=running;
  opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v===val)o.selected=true;s.appendChild(o);});
  s.addEventListener('change',()=>onChange(s.value)); return s;
}
function mNumInp(val, min, max, onChange, unit) {
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;align-items:center;gap:3px;';
  const i=document.createElement('input'); i.type='number'; i.className='f-inp'; i.value=val; i.min=min; i.max=max;
  i.style.width='50px'; i.disabled=running;
  i.addEventListener('change',()=>{let v=parseInt(i.value,10);if(isNaN(v))v=min;v=Math.max(min,Math.min(max,v));i.value=v;onChange(v);});
  wrap.appendChild(i);
  if(unit){const u=document.createElement('span');u.textContent=unit;u.style.cssText='font-size:.65rem;color:var(--muted);';wrap.appendChild(u);}
  return wrap;
}

/* ═══════════════════ INITIALIZE ═══════════════════ */
el.btnStart.addEventListener('click', startWorkout);
el.btnPause.addEventListener('click', pauseResume);
el.btnSkip .addEventListener('click', skipEx);
el.btnReset.addEventListener('click', resetAll);
$('btnAddEx').addEventListener('click', addExercise);

renderPlaylist();
</script>

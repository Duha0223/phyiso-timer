<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physio Workout Suite</title>
<style>
  :root {
    --glass-card: rgba(18, 32, 25, 0.76);
    --glass-border: rgba(180, 225, 195, 0.28);
    --glass-border-light: rgba(255, 255, 255, 0.18);
    --text: #f3f9f4;
    --muted: #a6c9b2;
    --col-ready:  #e08a3c;
    --col-active: #d65d45;
    --col-rest:   #4ba368;
    --col-done:   #2e5c3e;
    --col-plain:  #d1973c;
    --col-next:   #345843;
    
    /* Layout Variables */
    --left-col-width: 44%;
    --left-top-height: 52%;
    --right-top-height: 58%;
    --circle-dyn-size: 150px;
  }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; padding: 10px 14px;
    background: url('https://wallpapers-clan.com/wp-content/uploads/2024/07/studio-ghibli-totoro-forest-desktop-wallpaper-preview.jpg') no-repeat center center fixed;
    background-size: cover;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1720px;
    height: 97vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Header Bar with Visibility Toggles ── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 6px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .brand-group { display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 1.25rem; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .sub { color: var(--muted); font-size: .75rem; }

  .toggle-bar {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .toggle-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border-light);
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: .75rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .toggle-btn.active {
    background: var(--col-rest);
    color: #fff;
    border-color: #8edaa5;
  }

  /* ── Main Layout: Left & Right Columns ── */
  .layout-grid {
    display: flex;
    flex: 1;
    min-height: 0;
    position: relative;
    user-select: none;
  }

  /* ── Left Column: Timer on Top, Ambient Below ── */
  .left-col {
    width: var(--left-col-width);
    min-width: 280px;
    max-width: 75%;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  /* ── Right Column: YouTube on Top, Playlist Below ── */
  .right-col {
    flex: 1;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  /* ── Divider Splitters (Vertical & Horizontal) ── */
  .resizer-bar-v {
    width: 10px;
    cursor: col-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 4px;
    z-index: 10;
  }
  .resizer-bar-v::after {
    content: '';
    width: 4px;
    height: 70px;
    background: var(--glass-border);
    border-radius: 4px;
    transition: background .2s, height .2s;
  }
  .resizer-bar-v:hover::after, .resizer-bar-v.dragging::after {
    background: var(--col-rest);
    height: 120px;
  }

  .resizer-bar-h {
    height: 10px;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 3px 0;
    z-index: 10;
  }
  .resizer-bar-h::after {
    content: '';
    width: 70px;
    height: 4px;
    background: var(--glass-border);
    border-radius: 4px;
    transition: background .2s, width .2s;
  }
  .resizer-bar-h:hover::after, .resizer-bar-h.dragging::after {
    background: var(--col-rest);
    width: 120px;
  }

  /* ── Generic Glass Panel Container ── */
  .panel {
    background: var(--glass-card);
    border: 1.5px solid var(--glass-border);
    border-radius: 18px;
    padding: 12px 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.38);
    display: flex;
    flex-direction: column;
    position: relative;
    min-height: 70px;
    overflow: hidden;
  }
  .panel.hidden { display: none !important; }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  .panel-title {
    font-size: .78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  /* ── Stage Timer Box ── */
  #panel-timer {
    height: var(--left-top-height);
    flex-shrink: 0;
    container-type: size;
  }
  .stage-inner {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    justify-items: center;
    gap: 14px;
    flex: 1;
    min-height: 0;
    width: 100%;
    padding: 4px 8px;
  }

  /* Centered Circle with Box Clamping */
  .circle-center-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  .circle-wrap {
    position: relative;
    width: min(var(--circle-dyn-size), 75cqh, 55cqw);
    height: min(var(--circle-dyn-size), 75cqh, 55cqw);
    aspect-ratio: 1/1;
    flex-shrink: 0;
  }
  .circle-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  circle.bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 12; }
  circle.fg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke .3s; }
  .circle-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .bignum { font-size: min(calc(var(--circle-dyn-size) * 0.28), 2.6rem); font-weight: 900; line-height: 1; }

  .stage-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 90px;
  }
  .ex-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .ex-phase { font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }

  /* Vertically Stacked Controls */
  .btn-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
    flex-shrink: 0;
  }
  button.ctrl {
    border: 1px solid var(--glass-border-light); border-radius: 8px; padding: 6px 10px;
    font-size: .75rem; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.12); color: var(--text);
    width: 96px;
    text-align: center;
    transition: transform .1s, background .15s;
  }
  button.ctrl:hover { background: rgba(255,255,255,0.22); }
  button.ctrl:active { transform: scale(0.96); }
  button.ctrl.primary { background: var(--col-active); border-color: rgba(255,255,255,0.3); }
  button.ctrl.danger  { background: rgba(144, 48, 16, 0.7); }
  button.ctrl.pause-all { background: #b8600a; border-color: #f7a261; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  /* ── Ambient Sound Panel ── */
  #panel-sounds {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .sound-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    margin-top: 4px;
  }
  .sound-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .sound-card:hover { background: rgba(255, 255, 255, 0.15); }
  .sound-card.active { background: var(--col-rest); border-color: #8edaa5; }
  .sound-card span { display: block; font-size: 1.3rem; margin-bottom: 2px; }
  .sound-card small { font-size: .75rem; font-weight: 600; }

  /* ── Mini YouTube Station (Browsable Mirror) ── */
  #panel-yt {
    height: var(--right-top-height);
    flex-shrink: 0;
  }
  .yt-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-shrink: 0;
    align-items: center;
  }
  .btn-mirror {
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid var(--glass-border-light);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: .74rem;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s;
  }
  .btn-mirror:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
  .yt-station-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1.5px solid var(--glass-border);
  }
  .yt-station-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ── Playlist Panel ── */
  #panel-playlist {
    flex: 1;
    min-height: 0;
  }
  .playlist-container {
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
    margin-bottom: 6px;
  }
  .playlist-container::-webkit-scrollbar { width: 5px; }
  .playlist-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  #playlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li.ex-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }
  li.ex-item:hover { background: rgba(255,255,255,0.1); }
  li.ex-item.active-ex { border-color: #f7a261; box-shadow: 0 0 10px rgba(224, 138, 60, 0.35); background: rgba(46, 75, 58, 0.7); }

  .ex-header {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; cursor: pointer; user-select: none;
  }
  .handle { cursor: grab; color: var(--muted); font-size: .95rem; }
  .ex-check { accent-color: var(--col-rest); width: 14px; height: 14px; cursor: pointer; }
  .ex-label { flex: 1; min-width: 0; }
  .ex-label-name { font-weight: 700; font-size: .84rem; }
  .ex-label-meta { font-size: .68rem; color: var(--muted); }
  .chevron { color: var(--muted); font-size: .78rem; transition: transform .2s; }
  .chevron.open { transform: rotate(90deg); }

  .ex-body { display: none; padding: 6px 9px 8px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.15); }
  .ex-body.open { display: block; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px,1fr)); gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: .62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .f-inp {
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 6px;
    padding: 4px 6px; font-size: .76rem; color: #fff; width: 100%;
  }
  .f-inp option { background: #1b2e23; color: #fff; }
  .time-row { display: flex; gap: 3px; align-items: center; }
  .time-row .f-inp { width: 44px; }
  .ex-actions { margin-top: 6px; display: flex; }
  .btn-delete { background: rgba(180, 40, 40, 0.4); color: #fff; border-radius: 6px; padding: 3px 8px; font-size: .7rem; margin-left: auto; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }

  .btn-add {
    width: 100%; background: rgba(75, 163, 104, 0.35); border: 1px solid rgba(142, 218, 165, 0.4);
    border-radius: 9px; padding: 7px; font-size: .8rem; color: #fff; font-weight: 700; cursor: pointer;
    flex-shrink: 0;
  }

  footer { color: var(--muted); font-size: .68rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-group">
      <h1>🩹 Physio Workout Suite</h1>
      <div class="sub">Dynamic Multi-Split Station</div>
    </div>
    <div class="toggle-bar">
      <span style="font-size:.72rem;color:var(--muted);margin-right:2px;">Panels:</span>
      <button class="toggle-btn active" data-target="panel-timer">⏱️ Timer</button>
      <button class="toggle-btn active" data-target="panel-sounds">🌿 Sounds</button>
      <button class="toggle-btn active" data-target="panel-yt">📺 YouTube</button>
      <button class="toggle-btn active" data-target="panel-playlist">📋 Playlist</button>
    </div>
  </header>

  <div class="layout-grid" id="layoutGrid">
    <!-- LEFT SIDE: Timer on Top, Ambient Sounds Below -->
    <div class="left-col" id="leftCol">
      <!-- 1. Stage Timer Box -->
      <div class="panel" id="panel-timer">
        <div class="panel-header">
          <span class="panel-title">⏱️ Workout Stage</span>
        </div>
        <div class="stage-inner">
          <!-- Centered Circle Container -->
          <div class="circle-center-slot">
            <div class="circle-wrap" id="circleWrap">
              <svg viewBox="0 0 200 200">
                <circle class="bg" cx="100" cy="100" r="86"/>
                <circle class="fg" id="fgCircle" cx="100" cy="100" r="86"
                  stroke-dasharray="540" stroke-dashoffset="540" stroke="var(--col-ready)"/>
              </svg>
              <div class="circle-center">
                <div class="bignum" id="bignum">--</div>
              </div>
            </div>
          </div>

          <!-- Routine Labels -->
          <div class="stage-info">
            <div class="ex-title" id="exTitle">Ready</div>
            <div class="ex-phase" id="exPhase">Tap Start Workout</div>
          </div>

          <!-- Vertically Stacked Controls on the Side -->
          <div class="btn-col">
            <button class="ctrl primary" id="btnStart">▶ Start</button>
            <button class="ctrl" id="btnPause" disabled>⏸ Pause</button>
            <button class="ctrl pause-all" id="btnPauseAll">⏸ Pause All</button>
            <button class="ctrl" id="btnSkip" disabled>⏭ Skip</button>
            <button class="ctrl danger" id="btnReset">↺ Reset</button>
          </div>
        </div>
      </div>

      <!-- Left Horizontal Resizer Bar -->
      <div class="resizer-bar-h" id="resizerLeftH"></div>

      <!-- 2. Ambient Sounds Box -->
      <div class="panel" id="panel-sounds">
        <div class="panel-header">
          <span class="panel-title">🌿 Ambient Sounds</span>
        </div>
        <div class="sound-grid">
          <div class="sound-card active" data-src="">
            <span>🔇</span><small>Mute</small>
          </div>
          <div class="sound-card" data-src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Rain_sound.ogg">
            <span>🌧️</span><small>Rain</small>
          </div>
          <div class="sound-card" data-src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Forest_birds_ambience_sound.ogg">
            <span>🌲</span><small>Birds</small>
          </div>
          <div class="sound-card" data-src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Ocean_waves.ogg">
            <span>🌊</span><small>Ocean</small>
          </div>
          <div class="sound-card" data-src="https://upload.wikimedia.org/wikipedia/commons/1/14/Small_stream_flowing.ogg">
            <span>💧</span><small>Stream</small>
          </div>
          <div class="sound-card" data-src="https://upload.wikimedia.org/wikipedia/commons/b/b5/Bird_song_in_spring.ogg">
            <span>☀️</span><small>Meadow</small>
          </div>
        </div>
        <audio id="ambientAudio" loop crossorigin="anonymous"></audio>
      </div>
    </div>

    <!-- Middle Vertical Resizer Bar -->
    <div class="resizer-bar-v" id="resizerBarV"></div>

    <!-- RIGHT SIDE: Mini YouTube on Top, Playlist Below -->
    <div class="right-col" id="rightCol">
      <!-- 3. Mini YouTube Station Box (Full Browsable Interface) -->
      <div class="panel" id="panel-yt">
        <div class="panel-header">
          <span class="panel-title">📺 Mini YouTube Station</span>
        </div>
        <div class="yt-nav">
          <button class="btn-mirror" onclick="setMirror('https://piped.video/trending')">Piped</button>
          <button class="btn-mirror" onclick="setMirror('https://inv.nadeko.net')">Nadeko</button>
          <button class="btn-mirror" onclick="setMirror('https://invidious.asir.dev')">Asir</button>
          <button class="btn-mirror" style="margin-left:auto;" onclick="reloadFrame()">↺ Reload</button>
        </div>
        <div class="yt-station-wrap">
          <iframe id="ytStationFrame" src="https://piped.video/trending" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
        </div>
      </div>

      <!-- Right Horizontal Resizer Bar -->
      <div class="resizer-bar-h" id="resizerRightH"></div>

      <!-- 4. Exercise Playlist Box -->
      <div class="panel" id="panel-playlist">
        <div class="panel-header">
          <span class="panel-title">📋 Exercise Sequence</span>
        </div>
        <div class="playlist-container">
          <ul id="playlist"></ul>
        </div>
        <button class="btn-add" id="btnAddEx">＋ Add Exercise</button>
      </div>
    </div>
  </div>

  <footer>Fully adjustable layout splitters · Keep screen active enabled</footer>
</div>

<script>
/* ═══════════════════ DATA & STORAGE ═══════════════════ */
const STORAGE_KEY = 'physio_suite_v8';
const CIRC = 2 * Math.PI * 86;

const DEFAULT_EXERCISES = [
  { id:'heat',        name:'Heat Pad',                      enabled:true, type:'plain',   sets:1, reps:1,  repUnit:'min', repMins:15, repSecs:0,  restSecs:3, restEnabled:false },
  { id:'slrL',        name:'SLR – Left Leg',                enabled:true, type:'counted', sets:1, reps:10, repUnit:'sec', repMins:0,  repSecs:5,  restSecs:3, restEnabled:true  },
  { id:'slrR',        name:'SLR – Right Leg',               enabled:true, type:'counted', sets:1, reps:10, repUnit:'sec', repMins:0,  repSecs:5,  restSecs:3, restEnabled:true  },
  { id:'glute',       name:'Glute Bridge',                  enabled:true, type:'counted', sets:1, reps:8,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'fig4L',       name:'Figure 4 Stretch – Left',       enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'fig4R',       name:'Figure 4 Stretch – Right',      enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'wideGlute',   name:'Wide Stance Glute Bridge',      enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'narrowGlute', name:'Narrow Stance Glute Bridge',    enabled:true, type:'counted', sets:1, reps:5,  repUnit:'sec', repMins:0,  repSecs:10, restSecs:3, restEnabled:true  },
  { id:'plank',       name:'Plank',                         enabled:true, type:'plain',   sets:1, reps:1,  repUnit:'sec', repMins:0,  repSecs:30, restSecs:3, restEnabled:false },
];

function loadEx() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
}
function saveEx() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(exercises)); } catch(e){} }

let exercises = loadEx();
function repDur(ex) { return ex.repUnit==='min' ? ex.repMins*60+(ex.repSecs||0) : (ex.repSecs||0); }
function metaText(ex) {
  const d = repDur(ex);
  const ds = ex.repUnit==='min' ? `${ex.repMins}m${(ex.repSecs||0)?(' '+(ex.repSecs||0)+'s'):''}` : `${d}s`;
  if (ex.type==='plain') return `Timer · ${ds}`;
  const r = ex.restEnabled ? ` · rest ${ex.restSecs}s` : '';
  return `${ex.sets} set${ex.sets>1?'s':''} · ${ex.reps} reps · ${ds}/rep${r}`;
}

/* ═══════════════════ STATE ═══════════════════ */
let running=false, paused=false, stopReq=false, skipReq=false, runToken=0;
let wakeLock = null;

const $=id=>document.getElementById(id);
const el={
  title:$('exTitle'), phase:$('exPhase'), bignum:$('bignum'),
  fg:$('fgCircle'), btnStart:$('btnStart'), btnPause:$('btnPause'),
  btnSkip:$('btnSkip'), btnReset:$('btnReset'), playlist:$('playlist'),
  ambientAudio:$('ambientAudio'), btnPauseAll:$('btnPauseAll'),
  leftCol:$('leftCol'), rightCol:$('rightCol'), layoutGrid:$('layoutGrid'),
  resizerBarV:$('resizerBarV'), resizerLeftH:$('resizerLeftH'), resizerRightH:$('resizerRightH'),
  panelTimer:$('panel-timer'), panelSounds:$('panel-sounds'), panelYt:$('panel-yt'), panelPlaylist:$('panel-playlist'),
  ytStationFrame:$('ytStationFrame')
};

/* ═══════════════════ RESIZERS ═══════════════════ */
let currentDrag = null;

el.resizerBarV.addEventListener('mousedown', () => {
  currentDrag = 'vertical';
  el.resizerBarV.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
});

el.resizerLeftH.addEventListener('mousedown', () => {
  currentDrag = 'leftH';
  el.resizerLeftH.classList.add('dragging');
  document.body.style.cursor = 'row-resize';
});

el.resizerRightH.addEventListener('mousedown', () => {
  currentDrag = 'rightH';
  el.resizerRightH.classList.add('dragging');
  document.body.style.cursor = 'row-resize';
});

window.addEventListener('mousemove', e => {
  if (!currentDrag) return;

  if (currentDrag === 'vertical') {
    const gridRect = el.layoutGrid.getBoundingClientRect();
    const percent = ((e.clientX - gridRect.left) / gridRect.width) * 100;
    const clamped = Math.min(Math.max(percent, 20), 80);
    document.documentElement.style.setProperty('--left-col-width', `${clamped}%`);
  } 
  else if (currentDrag === 'leftH') {
    const colRect = el.leftCol.getBoundingClientRect();
    const percent = ((e.clientY - colRect.top) / colRect.height) * 100;
    const clamped = Math.min(Math.max(percent, 15), 85);
    document.documentElement.style.setProperty('--left-top-height', `${clamped}%`);
    
    // Scale timer dynamically within containment
    const availableH = (colRect.height * (clamped / 100)) - 55;
    const dynSize = Math.max(Math.min(availableH, 260), 90);
    document.documentElement.style.setProperty('--circle-dyn-size', `${dynSize}px`);
  } 
  else if (currentDrag === 'rightH') {
    const colRect = el.rightCol.getBoundingClientRect();
    const percent = ((e.clientY - colRect.top) / colRect.height) * 100;
    const clamped = Math.min(Math.max(percent, 15), 85);
    document.documentElement.style.setProperty('--right-top-height', `${clamped}%`);
  }
});

window.addEventListener('mouseup', () => {
  if (currentDrag) {
    el.resizerBarV.classList.remove('dragging');
    el.resizerLeftH.classList.remove('dragging');
    el.resizerRightH.classList.remove('dragging');
    document.body.style.cursor = 'default';
    currentDrag = null;
  }
});

/* ═══════════════════ PANEL VISIBILITY TOGGLES ═══════════════════ */
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.dataset.target;
    const panel = $(targetId);
    if (panel) {
      panel.classList.toggle('hidden');
      btn.classList.toggle('active', !panel.classList.contains('hidden'));

      if (targetId === 'panel-timer' || targetId === 'panel-sounds') {
        const timerHidden = el.panelTimer.classList.contains('hidden');
        const soundsHidden = el.panelSounds.classList.contains('hidden');
        el.resizerLeftH.style.display = (timerHidden || soundsHidden) ? 'none' : 'flex';
        if (timerHidden) el.panelSounds.style.flex = '1';
        if (soundsHidden) el.panelTimer.style.height = '100%';
        if (!timerHidden && !soundsHidden) el.panelTimer.style.height = 'var(--left-top-height)';
      }

      if (targetId === 'panel-yt' || targetId === 'panel-playlist') {
        const ytHidden = el.panelYt.classList.contains('hidden');
        const playlistHidden = el.panelPlaylist.classList.contains('hidden');
        el.resizerRightH.style.display = (ytHidden || playlistHidden) ? 'none' : 'flex';
        if (ytHidden) el.panelPlaylist.style.flex = '1';
        if (playlistHidden) el.panelYt.style.height = '100%';
        if (!ytHidden && !playlistHidden) el.panelYt.style.height = 'var(--right-top-height)';
      }
    }
  });
});

/* ═══════════════════ MINI YOUTUBE STATION CONTROLS ═══════════════════ */
function setMirror(url) {
  el.ytStationFrame.src = url;
}

function reloadFrame() {
  const current = el.ytStationFrame.src;
  el.ytStationFrame.src = '';
  setTimeout(() => { el.ytStationFrame.src = current; }, 50);
}

/* ═══════════════════ AMBIENT AUDIO ═══════════════════ */
document.querySelectorAll('.sound-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.sound-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    const src = card.dataset.src;
    if (src) {
      el.ambientAudio.src = src;
      el.ambientAudio.play().catch(e => console.warn("Audio waiting for interaction:", e));
    } else {
      el.ambientAudio.pause();
      el.ambientAudio.src = '';
    }
  });
});

/* ═══════════════════ MASTER PAUSE ALL ═══════════════════ */
el.btnPauseAll.addEventListener('click', () => {
  if (running && !paused) {
    paused = true;
    el.btnPause.textContent = '▶ Resume';
    speak('All paused.');
  }
  if (el.ambientAudio) el.ambientAudio.pause();
});

/* ═══════════════════ WAKE LOCK & GRAPHICS ═══════════════════ */
async function acquireWakeLock() {
  if ('wakeLock' in navigator && !wakeLock) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch(e){}
  }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
}

function setCircle(frac, color) {
  el.fg.setAttribute('stroke-dashoffset', (CIRC*(1-Math.max(0,Math.min(1,frac)))).toFixed(2));
  el.fg.setAttribute('stroke', color);
}
setCircle(0,'var(--col-ready)');

function fmtTime(s) {
  if (s>=60) return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  return String(s);
}

function speak(text, rate=1, pitch=1) {
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); } catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.rate=rate; u.pitch=pitch; u.volume=1;
  window.speechSynthesis.speak(u);
}

/* ═══════════════════ TIMERS & TICKERS ═══════════════════ */
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
async function waitPaused(token) {
  while (paused && token===runToken && !stopReq && !skipReq) await sleep(80);
}

async function tickCircle(token, totalSecs, color, onTick) {
  let rem = totalSecs;
  setCircle(rem/totalSecs, color);
  if (onTick) onTick(rem);

  while (rem > 0) {
    if (token!==runToken || stopReq || skipReq) return false;
    await waitPaused(token);
    if (token!==runToken || stopReq || skipReq) return false;
    await sleep(1000);
    if (token!==runToken || stopReq || skipReq) return false;
    rem--;
    setCircle(rem/totalSecs, color);
    if (onTick) onTick(rem);
  }
  return true;
}

async function doReady(token, name) {
  el.title.textContent = name;
  el.phase.textContent = 'GET READY';
  speak('Ready.');
  for (let i=3; i>=1; i--) {
    if (token!==runToken || stopReq || skipReq) return false;
    await waitPaused(token);
    el.bignum.textContent = String(i);
    setCircle(i/3, 'var(--col-ready)');
    await sleep(1000);
  }
  return token===runToken && !stopReq && !skipReq;
}

async function doTransition(token, name) {
  el.title.textContent = name;
  el.phase.textContent = 'NEXT UP';
  el.bignum.textContent = '…';
  setCircle(1, 'var(--col-next)');
  speak(`Next: ${name}.`);
  await sleep(1800);
  return token===runToken && !stopReq && !skipReq;
}

async function doRest(token, secs) {
  if (!secs || secs<=0) return true;
  el.phase.textContent = 'REST';
  speak('Rest.');
  return await tickCircle(token, secs, 'var(--col-rest)', s => {
    el.bignum.textContent = fmtTime(s);
  });
}

async function runPlain(ex, token) {
  if (!await doReady(token, ex.name)) return;
  await sleep(300);
  const dur = repDur(ex);
  speak('Start.');
  const ok = await tickCircle(token, dur, 'var(--col-plain)', s => {
    el.phase.textContent = 'IN PROGRESS';
    el.bignum.textContent = fmtTime(s);
    if (dur>=120 && s===60) speak('One minute left.');
    else if (dur>=60 && s===30) speak('Thirty seconds left.');
    else if (s<=3 && s>0) speak(String(s));
  });
  if (ok) {
    speak('Done.');
    el.phase.textContent='COMPLETE';
    el.bignum.textContent='✓';
    setCircle(0,'var(--col-done)');
    await sleep(900);
  }
}

async function runCounted(ex, token) {
  const repSecs = repDur(ex);
  const restSecs = ex.restEnabled ? (ex.restSecs||0) : 0;

  for (let set=1; set<=ex.sets; set++) {
    if (token!==runToken || stopReq || skipReq) return;
    const setLbl = ex.sets>1 ? ` (Set ${set}/${ex.sets})` : '';

    if (!await doReady(token, ex.name+setLbl)) return;
    await sleep(200);
    speak('Start.');
    await sleep(600);

    for (let rep=1; rep<=ex.reps; rep++) {
      if (token!==runToken || stopReq || skipReq) return;
      await waitPaused(token);

      speak(String(rep));

      const ok = await tickCircle(token, repSecs, 'var(--col-active)', s => {
        el.phase.textContent = `REP ${rep} of ${ex.reps}${setLbl}`;
        el.bignum.textContent = fmtTime(s);
      });
      if (!ok) return;

      const lastRep = rep===ex.reps, lastSet = set===ex.sets;
      if (restSecs>0 && !(lastRep && lastSet)) {
        if (!await doRest(token, restSecs)) return;
      }
    }

    speak('Set complete.');
    el.phase.textContent=`SET ${set} COMPLETE`;
    el.bignum.textContent='✓';
    setCircle(0,'var(--col-done)');
    await sleep(900);

    if (set < ex.sets) {
      speak('Rest before next set.');
      el.phase.textContent='REST — NEXT SET';
      const setRest = Math.max(restSecs*3, 15);
      if (!await tickCircle(token, setRest, 'var(--col-rest)', s => {
        el.bignum.textContent=fmtTime(s);
      })) return;
    }
  }

  el.phase.textContent='COMPLETE';
  el.bignum.textContent='✓';
  setCircle(0,'var(--col-done)');
  await sleep(900);
}

/* ═══════════════════ SEQUENCER ═══════════════════ */
async function startWorkout() {
  if (running) return;
  await acquireWakeLock();

  running=true; paused=false; stopReq=false; skipReq=false;
  runToken++;
  const token = runToken;
  el.btnStart.disabled=true; el.btnPause.disabled=false; el.btnSkip.disabled=false;
  renderPlaylist();

  const active = exercises.filter(e => e.enabled);
  if (!active.length) {
    el.title.textContent='No exercises enabled';
    el.phase.textContent='Enable at least one below';
    endSession();
    return;
  }

  for (let i=0; i<active.length; i++) {
    if (token!==runToken || stopReq) break;
    skipReq = false;
    const ex = active[i];
    highlightActive(ex.id);

    if (i > 0) {
      const ok = await doTransition(token, ex.name);
      if (!ok && !skipReq) break;
    }
    
    if (token!==runToken || stopReq) break;

    if (ex.type === 'plain') await runPlain(ex, token);
    else                     await runCounted(ex, token);
  }

  if (token === runToken) {
    el.title.textContent = stopReq ? 'Stopped' : '🎉 Complete!';
    el.phase.textContent = stopReq ? '' : 'Great work!';
    el.bignum.textContent = stopReq ? '' : '✓';
    setCircle(0,'var(--col-done)');
    if (!stopReq) speak('Workout complete. Great job!');
    endSession();
  }
}

function endSession() {
  running=false; paused=false;
  releaseWakeLock();
  el.btnStart.disabled=false; el.btnPause.disabled=true; el.btnSkip.disabled=true;
  el.btnPause.textContent='⏸ Pause';
  highlightActive(null);
  renderPlaylist();
}

function pauseResume() {
  if (!running) return;
  paused = !paused;
  el.btnPause.textContent = paused ? '▶ Resume' : '⏸ Pause';
  if (paused) {
    try { window.speechSynthesis.cancel(); } catch(e){}
    speak('Paused.');
  } else {
    speak('Resuming.');
  }
}

function skipEx() {
  if (!running) return;
  try { window.speechSynthesis.cancel(); } catch(e){}
  skipReq = true;
}

function resetAll() {
  try { window.speechSynthesis.cancel(); } catch(e){}
  stopReq = true;
  skipReq = true;
  paused = false;
  runToken++;
  endSession();
  el.title.textContent = 'Ready';
  el.phase.textContent = 'Tap Start';
  el.bignum.textContent = '--';
  setCircle(0,'var(--col-ready)');
}

/* ═══════════════════ PLAYLIST UI ═══════════════════ */
let dragSrcId=null, openIds=new Set();

function highlightActive(id) {
  document.querySelectorAll('li.ex-item').forEach(li => {
    li.classList.toggle('active-ex', li.dataset.id === id);
    if (li.dataset.id === id) {
      li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
}

function newId() { return 'ex_'+Date.now()+'_'+Math.floor(Math.random()*1000); }

function addExercise() {
  const ex = {
    id: newId(),
    name: 'New Exercise',
    enabled: true,
    type: 'counted',
    sets: 1,
    reps: 10,
    repUnit: 'sec',
    repMins: 0,
    repSecs: 10,
    restSecs: 3,
    restEnabled: true
  };
  exercises.push(ex);
  openIds.add(ex.id);
  saveEx();
  renderPlaylist();
}

function deleteEx(id) {
  if (!confirm('Delete this exercise?')) return;
  exercises = exercises.filter(e => e.id !== id);
  openIds.delete(id);
  saveEx();
  renderPlaylist();
}

function renderPlaylist() {
  el.playlist.innerHTML='';
  exercises.forEach(ex => {
    const li=document.createElement('li'); li.className='ex-item'; li.dataset.id=ex.id;
    li.draggable=!running;
    const isOpen=openIds.has(ex.id);

    const hdr=document.createElement('div'); hdr.className='ex-header';
    const handle=document.createElement('span'); handle.className='handle'; handle.textContent='☰';
    hdr.appendChild(handle);
    const chk=document.createElement('input'); chk.type='checkbox'; chk.className='ex-check';
    chk.checked=ex.enabled; chk.disabled=running;
    chk.addEventListener('change',e=>{e.stopPropagation();ex.enabled=chk.checked;saveEx();renderPlaylist();});
    hdr.appendChild(chk);
    const lbl=document.createElement('div'); lbl.className='ex-label';
    lbl.innerHTML=`<div class="ex-label-name">${ex.name}</div><div class="ex-label-meta">${metaText(ex)}</div>`;
    hdr.appendChild(lbl);
    const chev=document.createElement('span'); chev.className='chevron'+(isOpen?' open':''); chev.textContent='›';
    hdr.appendChild(chev);
    hdr.addEventListener('click',e=>{if(e.target===chk)return;isOpen?openIds.delete(ex.id):openIds.add(ex.id);renderPlaylist();});
    li.appendChild(hdr);

    const body=document.createElement('div'); body.className='ex-body'+(isOpen?' open':'');
    const grid=document.createElement('div'); grid.className='field-grid';

    grid.appendChild(mField('Name',()=>{
      const i=mInpTxt(ex.name,v=>{ex.name=v;saveEx();renderPlaylist();}); return i;
    }));
    grid.appendChild(mField('Type',()=>{
      const s=mSel([['counted','Counted Reps'],['plain','Simple Timer']],ex.type,v=>{
        ex.type=v; if(v==='plain'){ex.sets=1;ex.reps=1;ex.restEnabled=false;} saveEx();renderPlaylist();
      }); return s;
    }));

    const dF=document.createElement('div'); dF.className='field';
    const dL=document.createElement('label'); dL.textContent='Duration'; dF.appendChild(dL);
    const uSel=mSel([['sec','Sec'],['min','Min']],ex.repUnit,v=>{ex.repUnit=v;saveEx();renderPlaylist();});
    uSel.style.marginBottom='3px'; dF.appendChild(uSel);
    if(ex.repUnit==='min'){
      const row=document.createElement('div'); row.className='time-row';
      row.appendChild(mNumInp(ex.repMins,0,60,v=>{ex.repMins=v;saveEx();renderPlaylist();},'m'));
      row.appendChild(mNumInp(ex.repSecs||0,0,59,v=>{ex.repSecs=v;saveEx();renderPlaylist();},'s'));
      dF.appendChild(row);
    } else {
      dF.appendChild(mNumInp(ex.repSecs,1,3600,v=>{ex.repSecs=v;saveEx();renderPlaylist();},'s'));
    }
    grid.appendChild(dF);

    if(ex.type==='counted'){
      grid.appendChild(mField('Sets',()=>mNumInp(ex.sets,1,20,v=>{ex.sets=v;saveEx();renderPlaylist();})));
      grid.appendChild(mField('Reps',()=>mNumInp(ex.reps,1,50,v=>{ex.reps=v;saveEx();renderPlaylist();})));

      const rF=document.createElement('div'); rF.className='field';
      const rL=document.createElement('label'); rL.textContent='Rest (s)'; rF.appendChild(rL);
      const rRow=document.createElement('div'); rRow.className='time-row';
      const rChk=document.createElement('input'); rChk.type='checkbox'; rChk.checked=ex.restEnabled;
      rChk.disabled=running;
      rChk.addEventListener('change',()=>{ex.restEnabled=rChk.checked;saveEx();renderPlaylist();});
      rRow.appendChild(rChk);
      rRow.appendChild(mNumInp(ex.restSecs,1,60,v=>{ex.restSecs=v;saveEx();renderPlaylist();},'s'));
      rF.appendChild(rRow); grid.appendChild(rF);
    }

    body.appendChild(grid);
    const acts=document.createElement('div'); acts.className='ex-actions';
    const del=document.createElement('button'); del.className='btn-delete'; del.textContent='🗑 Delete';
    del.disabled=running; del.addEventListener('click',()=>deleteEx(ex.id)); acts.appendChild(del);
    body.appendChild(acts);
    li.appendChild(body);

    li.addEventListener('dragstart',e=>{if(running)return;dragSrcId=ex.id;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    li.addEventListener('dragend',()=>li.classList.remove('dragging'));
    li.addEventListener('dragover',e=>e.preventDefault());
    li.addEventListener('drop',e=>{
      e.preventDefault(); if(running||!dragSrcId||dragSrcId===ex.id)return;
      const fi=exercises.findIndex(x=>x.id===dragSrcId), ti=exercises.findIndex(x=>x.id===ex.id);
      const[m]=exercises.splice(fi,1); exercises.splice(ti,0,m);
      dragSrcId=null; saveEx(); renderPlaylist();
    });

    el.playlist.appendChild(li);
  });
}

function mField(label, buildInput) {
  const f=document.createElement('div'); f.className='field';
  const l=document.createElement('label'); l.textContent=label; f.appendChild(l);
  f.appendChild(buildInput()); return f;
}
function mInpTxt(val, onChange) {
  const i=document.createElement('input'); i.type='text'; i.className='f-inp'; i.value=val; i.disabled=running;
  i.addEventListener('change',()=>onChange(i.value)); return i;
}
function mSel(opts, val, onChange) {
  const s=document.createElement('select'); s.className='f-inp'; s.disabled=running;
  opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v===val)o.selected=true;s.appendChild(o);});
  s.addEventListener('change',()=>onChange(s.value)); return s;
}
function mNumInp(val, min, max, onChange, unit) {
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;align-items:center;gap:3px;';
  const i=document.createElement('input'); i.type='number'; i.className='f-inp'; i.value=val; i.min=min; i.max=max;
  i.style.width='44px'; i.disabled=running;
  i.addEventListener('change',()=>{let v=parseInt(i.value,10);if(isNaN(v))v=min;v=Math.max(min,Math.min(max,v));i.value=v;onChange(v);});
  wrap.appendChild(i);
  if(unit){const u=document.createElement('span');u.textContent=unit;u.style.cssText='font-size:.62rem;color:var(--muted);';wrap.appendChild(u);}
  return wrap;
}

/* ═══════════════════ INITIALIZE ═══════════════════ */
el.btnStart.addEventListener('click', startWorkout);
el.btnPause.addEventListener('click', pauseResume);
el.btnSkip .addEventListener('click', skipEx);
el.btnReset.addEventListener('click', resetAll);
$('btnAddEx').addEventListener('click', addExercise);

renderPlaylist();
</script>
